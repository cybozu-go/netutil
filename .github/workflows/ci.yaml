name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  id-token: write
jobs:
  test:
    name: Small test
    strategy:
      matrix:
        os: ["ubuntu-26.04", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - run: test -z "$(gofmt -s -l . | tee /dev/stderr)"
      - run: go build .
      - run: go test -race -v -count 1 .
      - run: go vet .
      - name: staticcheck
        run: go tool staticcheck .
